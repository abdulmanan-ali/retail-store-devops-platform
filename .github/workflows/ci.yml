name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env: 
  AWS_REGION: us-east-1
  ECR_REGISTRY: 866849310135.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [catalog, orders, checkout, cart, ui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -f devops/docker/${{ matrix.service }}/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/retail-store-${{ matrix.service }}:${{ github.sha }} \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/retail-store-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          # ignore-unfixed: true

      - name: Push Docker image to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/retail-store-${{ matrix.service }}:${{ github.sha }}

  update-helm-tags:
    name: Update Helm Image Tags
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update all image name & tags
        run: |
          for service in catalog orders checkout cart ui; do
            sed -i "/^  ${service}:$/,/tag:/ s|image: .*|image: ${env.ECR_REGISTRY}/retail-store-${service}|" devops/kubernetes/helm/retail-store/values.yaml
            sed -i "/^  ${service}:$/,/tag:/ s|tag: \".*\"|tag: \"${{ github.sha }}\"|" devops/kubernetes/helm/retail-store/values.yaml
          done

      - name: Commit and push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "ci@github.com"
          git add devops/kubernetes/helm/retail-store/values.yaml
          git diff --staged --quiet || git commit -m "ci: update all image tags to ${{ github.sha }}"
          git push origin main
