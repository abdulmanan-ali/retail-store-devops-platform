# writing the alert manager configuration for monitoring alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: retail-store-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: retail-store-alerts
    rules:
    - alert: ServiceDown
      expr: up{namespace="retail-store"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "${ $labels.service } is down"
        description: "The service ${ $labels.service } in namespace retail-store has been down (up=0) for more than 2 minutes."
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{namespace="retail-store"}[15m]) > 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod ${ $labels.pod } is crash looping"
        description: "Container ${ $labels.container } in pod ${ $labels.pod } has restarted more than 3 times in the last 15 minutes."
  - name: HPAMaxedOut
    rules:
    - alert: HPAMaxedOut
      expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="retail-store"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="retail-store"}
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "HPA for ${ $labels.horizontalpodautoscaler } is maxed out"
        description: HPA ${ $labels.horizontalpodautoscaler } in namespace retail-store has reached its maximum number of replicas for more than 10 minutes.