apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: retail-store-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: retail-store-critical
      rules:
        - alert: ServiceDown
          expr: up{namespace="retail-store"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.service }} is down"
            description: "Service {{ $labels.service }} in namespace retail-store has been down for more than 2 minutes."

        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="retail-store"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 3 times in the last 15 minutes."

    - name: retail-store-warning
      rules:
        - alert: HPAMaxedOut
          expr: kube_horizontalpodautoscaler_status_current_replicas{namespace="retail-store"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="retail-store"}
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} is maxed out"
            description: "HPA {{ $labels.horizontalpodautoscaler }} has been at max replicas for more than 3 minutes."