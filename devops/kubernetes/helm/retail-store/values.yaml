global:
  imagePullPolicy: IfNotPresent
  namespace: retail-store

dbPassword: "change_me_to_secure_password"

services:
  catalog:
    image: 866849310135.dkr.ecr.us-east-1.amazonaws.com/retail-store-catalog
    tag: "d0585af8072e763ecff4329108e1c3d0bab03d24"
    port: 8080
    replicas: 1
    env:
      GIN_MODE: "release"
      RETAIL_CATALOG_PERSISTENCE_PROVIDER: "mysql"
      RETAIL_CATALOG_PERSISTENCE_ENDPOINT: "catalog-db:3306"

  cart:
    image: 866849310135.dkr.ecr.us-east-1.amazonaws.com/retail-store-cart
    tag: "d0585af8072e763ecff4329108e1c3d0bab03d24"
    port: 8080
    replicas: 1
    env:
      RETAIL_CART_PERSISTENCE_PROVIDER: "dynamodb"
      RETAIL_CART_PERSISTENCE_DYNAMODB_ENDPOINT: "http://cart-db:8000"
      RETAIL_CART_PERSISTENCE_DYNAMODB_CREATE_TABLE: "true"
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"

  checkout:
    image: 866849310135.dkr.ecr.us-east-1.amazonaws.com/retail-store-checkout
    tag: "d0585af8072e763ecff4329108e1c3d0bab03d24"
    port: 8080
    replicas: 1
    env:
      RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: "redis"
      RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: "redis://checkout-redis:6379"
      RETAIL_CHECKOUT_ENDPOINTS_ORDERS: "http://orders:8080"

  orders:
    image: 866849310135.dkr.ecr.us-east-1.amazonaws.com/retail-store-orders
    tag: "d0585af8072e763ecff4329108e1c3d0bab03d24"
    port: 8080
    replicas: 1
    env:
      RETAIL_ORDERS_PERSISTENCE_PROVIDER: "postgres"
      RETAIL_ORDERS_PERSISTENCE_ENDPOINT: "orders-db:5432"
      RETAIL_ORDERS_PERSISTENCE_NAME: "orders"
      RETAIL_ORDERS_PERSISTENCE_USERNAME: "orders_user"
      RETAIL_ORDERS_MESSAGING_PROVIDER: "rabbitmq"
      RETAIL_ORDERS_MESSAGING_RABBITMQ_ADDRESSES: "rabbitmq:5672"
      RETAIL_ORDERS_MESSAGING_RABBITMQ_USERNAME: "rabbitmq"

  ui:
    image: 866849310135.dkr.ecr.us-east-1.amazonaws.com/retail-store-ui
    tag: "d0585af8072e763ecff4329108e1c3d0bab03d24"
    port: 8080
    replicas: 1
    env:
      RETAIL_UI_ENDPOINTS_CATALOG: "http://catalog:8080"
      RETAIL_UI_ENDPOINTS_CARTS: "http://cart:8080"
      RETAIL_UI_ENDPOINTS_CHECKOUT: "http://checkout:8080"
      RETAIL_UI_ENDPOINTS_ORDERS: "http://orders:8080"

databases:
  catalog-db:
    image: mariadb
    tag: "10.9"
    port: 3306
    replicas: 1
    storage: 1Gi
    env:
      MYSQL_DATABASE: "catalogdb"
      MYSQL_USER: "catalog_user"

  cart-db:
    image: amazon/dynamodb-local
    tag: "1.20.0"
    port: 8000
    replicas: 1

  checkout-redis:
    image: redis
    tag: "6.0-alpine"
    port: 6379
    replicas: 1

  orders-db:
    image: postgres
    tag: "16.1"
    port: 5432
    replicas: 1
    storage: 1Gi
    env:
      POSTGRES_DB: "orders"
      POSTGRES_USER: "orders_user"

  rabbitmq:
    image: rabbitmq
    tag: "3-management"
    replicas: 1
    storage: 1Gi
    ports:
      amqp: 5672
      management: 15672
    env:
      RABBITMQ_DEFAULT_USER: "rabbitmq"