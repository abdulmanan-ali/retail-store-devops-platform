# argocd application for retail store app
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abdulmanan-ali/retail-store-devops-platform.git
    targetRevision: main
    path: devops/kubernetes/helm/retail-store
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: cart
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: orders
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: ui
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: catalog
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: checkout
      jsonPointers:
        - /spec/replicas
