apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abdulmanan-ali/retail-store-devops-platform.git
    targetRevision: main
    path: devops/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false