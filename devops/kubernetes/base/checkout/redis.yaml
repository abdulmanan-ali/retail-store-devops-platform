apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-redis-deployment
  namespace: retail-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-checkout
  template:
    metadata:
      labels:
        app: redis-checkout
    spec:
      containers:
      - name: redis
        image: redis:6.0-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - redis-cli ping
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
  namespace: retail-store
spec:
  selector:
    app: redis-checkout
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP